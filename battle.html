<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battle Preview</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;800&display=swap">
</head>
<body>
<main>
  <div id="frame" class="frame">
    <div id="labels" class="labels"></div>
    <div id="status" class="status" role="status"></div>
  </div>
  <section id="ui" class="ui" aria-label="Preview controls">
    <div class="group">
      <h2>View <span class="soft"><a href="./">Creature sheet</a></span></h2>
      <div class="row">
        <button class="tog" data-opt="sil" aria-pressed="false">Silhouette</button>
        <button class="tog" data-opt="boxes" aria-pressed="false">Size boxes</button>
        <button class="tog" data-opt="turn" aria-pressed="false" title="Enemies turned round instead of mirrored">Enemy turned</button>
        <button id="light" data-act="light" title="The creatures' own coloured lights: baked into their parts, live lights, or off">Creature light: baked</button>
        <button class="tog" data-opt="merge" aria-pressed="true" title="Merge every part that never moves on its own">Merge</button>
        <button class="tog" data-opt="bloom" aria-pressed="true" title="A soft halo round glowing parts only">Bloom</button>
        <button class="tog" data-opt="still" aria-pressed="false">Freeze</button>
        <button class="tog" data-opt="joints" aria-pressed="false" title="Show every rig joint and bone">Joints</button>
        <button class="tog" data-opt="flex" aria-pressed="false" title="Swing every joint, to check what each one carries">Flex</button>
      </div>
      <p id="perf" class="soft"></p>
    </div>
    <div class="group">
      <h2>Play <span class="soft">(the picked creature, or player front middle, against the enemy facing it)</span></h2>
      <div class="row">
        <button data-clip="attack">Attack</button>
        <button data-clip="ultimate">Ultimate</button>
        <button data-clip="allattack" title="Every player creature attacks the enemy facing it">All attack</button>
        <button data-clip="hit">Hit</button>
        <button data-clip="faint">Faint</button>
        <button data-clip="victory">Victory</button>
        <button class="tog" data-clip="loop" data-opt-show="loop" aria-pressed="false" title="Attack and answer, over and over">Exchange</button>
        <button data-clip="stop">Stop</button>
      </div>
    </div>
    <div class="group">
      <h2>Teams</h2>
      <div class="teams">
        <div><span class="cap">Player &middot; back | front</span><div id="grid-p" class="grid"></div></div>
        <div><span class="cap">Enemy &middot; front | back</span><div id="grid-e" class="grid"></div></div>
      </div>
      <div class="row">
        <select id="pick" aria-label="Creature for Solo and All"></select>
        <button data-act="solo">Solo</button>
        <button data-act="all">All of it</button>
        <button data-act="roster">Roster mix</button>
        <button data-act="swap">Swap sides</button>
      </div>
    </div>
    <div class="group">
      <h2>Formation and camera <span class="soft">(locked in src/arena/layout.js; sliders are for trying)</span></h2>
      <div class="sliders">
        <label>Camera angle <input id="r-elev" data-layout="elev" type="range" min="0" max="60" step="1"><output id="v-elev"></output>&deg;</label>
        <label>Field of view <input id="r-fov" data-layout="fov" type="range" min="12" max="60" step="1"><output id="v-fov"></output>&deg;</label>
        <label>Aim height <input id="r-aim" data-layout="aim" type="range" min="0" max="6" step=".1"><output id="v-aim"></output></label>
        <label>Front row from centre <input id="r-front" data-layout="front" type="range" min="2" max="10" step=".1"><output id="v-front"></output></label>
        <label>Row gap <input id="r-rowGap" data-layout="rowGap" type="range" min="3" max="12" step=".1"><output id="v-rowGap"></output></label>
        <label>Column gap <input id="r-colGap" data-layout="colGap" type="range" min="2" max="9" step=".1"><output id="v-colGap"></output></label>
        <label>Zoom <input id="r-zoom" data-layout="zoom" type="range" min=".5" max="3" step=".05"><output id="v-zoom"></output></label>
      </div>
      <div class="row">
        <button data-act="reset">Locked layout</button>
        <button data-act="copy">Copy link</button>
        <code id="layout"></code>
      </div>
    </div>
  </section>
</main>
<script type="module" src="/src/preview/main.js"></script>
</body>
</html>
