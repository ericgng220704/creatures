<title>Second Creature Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: a showcase. One large turntable view per creature, its name and notes beside or below, nothing else. */
:root {
  --bg: #eceef3;
  --panel: #ffffff;
  --ink: #1f2230;
  --ink-soft: #5d6274;
  --line: #d6d9e2;
  --btn: #1f2230;
  --btn-ink: #ffffff;
  --well-a: #e3e6ee;
  --well-b: #aeb5c4;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15161b; --panel: #1f2027; --ink: #eef0f6; --ink-soft: #a2a7b8; --line: #30323d;
    --btn: #eef0f6; --btn-ink: #15161b; --well-a: #3a3d49; --well-b: #17181d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15161b; --panel: #1f2027; --ink: #eef0f6; --ink-soft: #a2a7b8; --line: #30323d;
  --btn: #eef0f6; --btn-ink: #15161b; --well-a: #3a3d49; --well-b: #17181d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 28px 56px; }
main { max-width: 1120px; margin-inline: auto; display: grid; gap: 30px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.1; }
h3 { font-size: 24px; }
p { margin: 0; }
.lede { color: var(--ink-soft); max-width: 66ch; margin-top: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
@media (max-width: 820px) { .card { grid-template-columns: minmax(0, 1fr); } }
.view { position: relative; aspect-ratio: 16 / 11; max-width: 100%; border-radius: 18px; overflow: hidden; background: radial-gradient(110% 85% at 50% 32%, var(--well-a), var(--well-b)); touch-action: pan-y; cursor: grab; }
.view:active { cursor: grabbing; }
.view canvas { display: block; width: 100%; height: 100%; }
.hint { position: absolute; right: 12px; bottom: 10px; font-size: 12px; font-weight: 800; color: var(--ink-soft); opacity: .85; pointer-events: none; }
.side { display: grid; gap: 12px; padding: 6px 4px; min-width: 0; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.tag { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.note { color: var(--ink-soft); font-size: 14px; }
ul.parts { margin: 0; padding-left: 18px; display: grid; gap: 5px; color: var(--ink-soft); font-size: 14px; }
ul.parts b { color: var(--ink); font-weight: 800; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 800; font-size: 14px; border: 0; border-radius: 999px; padding: 9px 16px; min-height: 40px; background: var(--btn); color: var(--btn-ink); cursor: pointer; }
button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
button[aria-pressed="true"].ghost { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
button:focus-visible { outline: 3px solid var(--ink-soft); outline-offset: 2px; }
button:active { transform: scale(.96); }
.fail { padding: 16px; color: var(--ink-soft); }
</style>

<main id="app">
  <header>
    <h1>Second creature sheet</h1>
    <p class="lede">Eleventh pass. Dunebreaker is gone. Five creatures join: Stormtalon the eagle, Sunmane the lion, Grandtusk the elephant, Ironpaw the panda and Duskseer the owl. Drag to turn, or let them spin. Head shows the face up close.</p>
  </header>
  <div id="cards" style="display:grid;gap:22px"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>

    for (var q2 = 0; q2 < 40; q2++) { var a2 = q2 / 40 * Math.PI * 2; ringPts.push([Math.cos(a2) * 1.9, .04, Math.sin(a2) * 1.9]); }
    var ringG = new T.Group(); root.add(ringG);
    glow(ringG, ttube(ringPts, .024, .024, 6, 120, true), P.rune, 0, 0, 0, 0, 0, 0, .55);
    for (var q3 = 0; q3 < 12; q3++) { var a3 = q3 / 12 * Math.PI * 2; glow(ringG, new T.BoxGeometry(.24, .02, .06), P.rune, Math.cos(a3) * 1.6, .04, Math.sin(a3) * 1.6, 0, -a3, 0, .6); }
    var light = new T.PointLight(0x9a8cff, 2.2, 5, 1.5); light.position.set(.8, 2.8, .6); body.add(light);
    moon.userData.noFit = true; ringG.traverse(function (o) { o.userData.noFit = true; });

    finish(root, 3.0);
    return {
      root: root, head: head, name: 'owl', headView: { span: 1.9, up: .1, look: 0 }, initYaw: -.9,
      update: function (t) {
        var br = Math.sin(t * 1.5);
        body.position.y = br * .012; body.scale.set(1, 1 + br * .008, 1 + br * .012);
        head.rotation.y = Math.sin(t * .5) * .85 * (Math.sin(t * .25) > -.2 ? 1 : .2);
        head.rotation.z = Math.sin(t * .7) * .04;
        ringG.rotation.y = t * .2; moon.rotation.y = .5 + Math.sin(t * .3) * .1;
        stars.forEach(function (s) { var a = t * .18 + s.ph * Math.PI * 2; s.m.position.set(Math.cos(a) * s.r, s.h + Math.sin(t * .8 + s.ph * 9) * .08, Math.sin(a) * s.r); s.m.rotation.y = t + s.ph * 5; s.m.scale.setScalar(.7 + .5 * Math.sin(t * 2 + s.ph * 12)); });
        light.intensity = 2 + Math.sin(t * 1.3) * .4;
        var blink = (t % 6.1) < .16 ? .12 : 1; eyes.forEach(function (e) { e.scale.y = blink; });
      }
    };
  }

  // ---------- views ----------
  function envFor(renderer) {
    var pm = new T.PMREMGenerator(renderer), sc = new T.Scene();
    var g = new T.SphereGeometry(20, 32, 16), p = g.attributes.position, col = new Float32Array(p.count * 3), top = C('#eef3ff'), bot = C('#4a4038');
    for (var i = 0; i < p.count; i++) { var t = sstep(-8, 14, p.getY(i)), c = mix(bot, top, t); col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; }
    g.setAttribute('color', new T.BufferAttribute(col, 3));
    sc.add(new T.Mesh(g, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide })));
    function panel(x, y, z, w, h, rr, gg, bb) { var m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: new T.Color(rr, gg, bb), side: T.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); sc.add(m); }
    panel(8, 12, 10, 10, 6, 4, 3.8, 3.5);
    panel(-12, 6, -10, 8, 10, 1.6, 2.2, 3);
    panel(0, 3, 16, 14, 4, 1, 1, 1);
    var tex = pm.fromScene(sc, .03).texture;
    pm.dispose();
    return tex;
  }
  function makeView(el) {
    var r = new T.WebGLRenderer({ antialias: true, alpha: true });
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    r.shadowMap.enabled = true; r.shadowMap.type = T.PCFSoftShadowMap;
    r.toneMapping = T.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
    r.outputColorSpace = T.SRGBColorSpace;
    el.appendChild(r.domElement);
    var s = new T.Scene();
    s.environment = envFor(r);
    s.add(new T.HemisphereLight(0xe6edff, 0x4a3d34, .55));
    var key = new T.DirectionalLight(0xfff0dc, 2.3);
    key.position.set(4, 9, 7); key.castShadow = true;
    key.shadow.mapSize.set(1536, 1536);
    var sc = key.shadow.camera; sc.left = -3.5; sc.right = 3.5; sc.top = 3.5; sc.bottom = -3.5; sc.near = .5; sc.far = 30;
    key.shadow.bias = -.0004; key.shadow.normalBias = .015;
    s.add(key);
    var rim = new T.DirectionalLight(0xbad8ff, 1.5); rim.position.set(-6, 5, -7); s.add(rim);
    var ground = new T.Mesh(new T.PlaneGeometry(40, 40), new T.ShadowMaterial({ opacity: .28 }));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; s.add(ground);
    var cam = new T.PerspectiveCamera(26, 16 / 11, .05, 100);
    var view = { r: r, s: s, cam: cam, el: el, mode: 'body' };
    function size() { var w = el.clientWidth, h = el.clientHeight; if (!w || !h) return; r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); if (view.fit) view.fit(); }
    new ResizeObserver(size).observe(el);
    size();
    return view;
  }
  function contactShadow(scene, w, d) {
    var m = new T.Mesh(new T.PlaneGeometry(w, d), new T.MeshBasicMaterial({ map: RADIAL, color: 0x000000, transparent: true, opacity: .32, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.y = .004; scene.add(m);
  }

  // ---------- the showcase ----------
  var INFO = {
    emberwolf: { name: 'Emberwolf', element: 'Fire', build: emberwolf, note: 'A heavy-shouldered wolf whose fire lives in its coat.',
      parts: ['<b>Body.</b> Deep chest, tucked waist, bent hind legs on hocks, toes and claws.', '<b>Coat.</b> Dark along the back, pale on the chest and belly. Soft overlapping locks of fur make the ruff, cheeks, chest fringe, spine and tail, darker at the root and paler at the tip.', '<b>Face.</b> Heavy brow, glowing slit eyes that blink, a jaw that breathes open on fangs and a tongue.', '<b>Fire.</b> A mane of layered flame from crown to back, a burning tail, ember veins, rising sparks and firelight on its own fur.'] },
    tidefang: { name: 'Tidefang', element: 'Water', build: tidefang, note: 'A heavy, armoured crocodile carrying the sea in crystal.',
      parts: ['<b>Body.</b> Long, deep and round-bellied, carried high on arms with shoulder and hip muscle, elbow knuckles, scutes up the back of each limb and a small crystal at every elbow. Webbed feet: five clawed toes in front, four behind.', '<b>Armour.</b> Keeled scutes in rows, a double crest down the tail, dark bands across the back, a pale belly.', '<b>Face.</b> Eye turrets with glowing eyes, a bulb nose, an interlocking jaw with two long fangs a side, and a deeper head to match the body.', '<b>Crystal.</b> Glowing clusters down the spine and a crystal fan at the tail, pulsing light onto its own scales, wave lines on each flank.'] },
    thornstag: { name: 'Thornstag', element: 'Plant', build: thornstag, note: 'A tall, gentle stag that the forest grows on, kind in the face and mighty in the shoulder.',
      parts: ['<b>Body.</b> A barrel of ribs, a tucked flank, withers and hips that rise, built shoulders and thighs, a crest of neck muscle. Slim legs with knees and hocks, cloven hooves, a soft throat ruff and a raised tail, cream beneath and tipped with a leaf sprig.', '<b>Coat.</b> Warm brown with a dark stripe down the spine, cream below, fawn spots over the flanks and haunches.', '<b>Face.</b> Large leaf ears that flick, wide soft eyes and a long muzzle closed in a small smile. No fangs.', '<b>Magic.</b> Great antlers in leaf and blossom with a glow behind them, leaves and petals turning round the crown, vines and blossoms at the neck, a leaf emblem on the chest, a moss mantle, rune light and fireflies.'] },
    stonemaul: { name: 'Stonemaul', element: 'Earth', build: stonemaul, note: 'A huge mountain bear in stone and iron, roaring, whose claws are its weapons.',
      parts: ['<b>Body.</b> A great shoulder hump, a deep barrel chest, pillar forelegs and a heavy rump, under a thick ruff of fur.', '<b>Claws.</b> Four steel claws on each forepaw, as long as a forearm and hooked down like blades.', '<b>Armour.</b> Stone gauntlets with iron bands and spikes, stone pauldrons with iron spikes, plates down the hump, all lined with amber rune light.', '<b>Face.</b> A roaring mouth with thick canines, small glowing eyes under angry brows.', '<b>Aura.</b> Two turning rings of rune light on the ground, rocks circling the bear, amber haze and rising motes.'] },
    wardshell: { name: 'Wardshell', element: 'Ward', build: wardshell, note: 'A sturdy tortoise with a plated shell, calm and hard to move, guarded by shields that circle it.',
      parts: ['<b>Shell.</b> A dome of raised hexagonal plates with sunken seams, a gold rim with spikes, a sigil and glowing gem at the crown, and a patch of moss and blossoms on one shoulder.', '<b>Legs.</b> Four thick pillars in stone shin plates and gold bands, with blunt nails.', '<b>Face.</b> A calm, noble head: a domed brow with a small stone crest, big golden eyes under heavy lids, a hooked beak and a closed mouth turned up at the corners.', '<b>Ward.</b> Eight shields of light circle the whole body, with a faint ring of light on their path.'] },

    lion: { name: 'Sunmane', element: 'Light', build: lion, note: 'A lion in the middle of a strike, with one paw raised and its claws out.',
      parts: ['<b>Strike.</b> The right paw swings up and through, four long curved claws out, with a golden slash that flares as it comes down.', '<b>Mane.</b> Four rings of long locks round the head, dark at the root and gold at the tip, with a beard and a cape over the shoulders.', '<b>Body.</b> A deep chest, heavy shoulders and haunches, a tucked waist and a tufted tail.', '<b>Face.</b> A roaring mouth with thick canines, burning amber eyes under a furrowed brow, and a sun-gold glow behind the head.'] },
    elephant: { name: 'Grandtusk', element: 'Titan', build: elephant, note: 'A giant elephant with tusks as long as its body is deep, wise and slow to anger.',
      parts: ['<b>Tusks.</b> Thick curved ivory, banded in gold at the base, each with a glowing gem.', '<b>Trunk.</b> Eight joints, so it sways and curls in a slow wave.', '<b>Body.</b> A vast barrel with pillar legs and wide feet, wrinkled grey skin, and ears like sails that flap.', '<b>Face.</b> A great dome of a brow, small kind eyes, and a rune of light on the forehead.'] },
    panda: { name: 'Ironpaw', element: 'Qi', build: panda, note: 'A panda warrior in a wide stance, one fist thrown and the other drawn back.',
      parts: ['<b>Fists.</b> The right arm drives forward in wrapped knuckles, with gold qi at the fist and bands of light flying off it. The left fist rests drawn back at the hip.', '<b>Stance.</b> A wide horse stance on black legs, a black belt with a gold buckle and red sash tails.', '<b>Face.</b> Black patches and ears, brows pulled down, a shouting mouth, and a red headband with a gold plate and two tails that stream behind.', '<b>Build.</b> A round, heavy trunk with a black shoulder band.'] },
    owl: { name: 'Duskseer', element: 'Night', build: owl, note: 'A wise owl on a mossy branch, awake while the world sleeps.',
      parts: ['<b>Face.</b> A heart of pale feathers round huge golden eyes, a small hooked beak and two ear tufts, on a head that turns far round.', '<b>Plumage.</b> A chest of barred scale-feathers, wings folded down the sides, a short barred tail.', '<b>Perch.</b> Talons gripping a forked, mossy branch held up by a root.', '<b>Night.</b> A crescent moon behind, stars that drift, and a ring of rune light turning on the ground.'] }
  };
  var spin = !reduced, live = [], slots = [];
  var cards = document.getElementById('cards');
  var ORDER = ['emberwolf', 'tidefang', 'thornstag', 'stonemaul', 'wardshell', 'pyrewing', 'eagle', 'lion', 'elephant', 'panda', 'owl'];
  // the box round a creature's solid parts, leaving out glow sprites that only look big
  function boxOf(root) {
    var box = new T.Box3();
    root.updateMatrixWorld(true);
    root.traverse(function (o) { if (o.isMesh && o.geometry && !o.userData.noFit) box.union(new T.Box3().setFromObject(o)); });
    return box;
  }
  function setup(info, card) {
    var el = card.querySelector('.view');
    var v = makeView(el);
    var a = info.build();
    var box = boxOf(a.root), sz = box.getSize(new T.Vector3()), ctr = box.getCenter(new T.Vector3());
    var pad = a.fitPad || {}, reach = Math.max(sz.x, sz.z), tall = sz.y + (pad.up || 0), mid = ctr.y + (pad.up || 0) / 2;
    a.pivot = new T.Group(); a.pivot.add(a.root);
    a.root.position.set(-ctr.x, 0, -ctr.z);
    a.yaw = a.initYaw != null ? a.initYaw : -.55; a.pivot.rotation.y = a.yaw;
    v.s.add(a.pivot);
    contactShadow(v.s, reach * 1.2, reach * .8);
    a.spin = spin;
    v.fit = function () {
      var fov = v.cam.fov * Math.PI / 180;
      if (v.mode === 'head') {
        var hp = new T.Vector3(); a.head.getWorldPosition(hp);
        var hv = a.headView || (a.name === 'thornstag' ? { span: 2.6, up: .65, look: .38 } : { span: 1.9, up: .3, look: 0 });
        var d = hv.span / 2 / Math.tan(fov / 2);
        v.cam.position.set(hp.x * .6 + .2, hp.y + hv.up, hp.z * .6 + d);
        v.cam.lookAt(hp.x, hp.y + hv.look, hp.z);
        return;
      }
      var h = Math.max(tall * 1.2, reach * 1.16 / v.cam.aspect);
      var dist = (h / 2) / Math.tan(fov / 2);
      v.cam.position.set(0, mid + tall * .5, dist);
      v.cam.lookAt(0, mid * .92, 0);
    };
    v.fit();
    var drag = null;
    el.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, yaw: a.yaw }; el.setPointerCapture(e.pointerId); });
    el.addEventListener('pointermove', function (e) { if (!drag) return; a.yaw = drag.yaw + (e.clientX - drag.x) * .012; });
    el.addEventListener('pointerup', function () { drag = null; });
    el.addEventListener('pointercancel', function () { drag = null; });
    a.dragging = function () { return !!drag; };
    card.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var x = b.getAttribute('data-a');
      if (x === 'spin') { a.spin = !a.spin; b.setAttribute('aria-pressed', a.spin); return; }
      v.mode = x;
      card.querySelector('[data-a="body"]').setAttribute('aria-pressed', x === 'body');
      card.querySelector('[data-a="head"]').setAttribute('aria-pressed', x === 'head');
      v.fit();
    });
    var entry = { a: a, v: v, vis: true };
    live.push(entry);
    return entry;
  }
  function ensure(slot) { if (!slot.entry) slot.entry = setup(slot.info, slot.card); return slot.entry; }
  ORDER.forEach(function (key) {
    var info = INFO[key];
    var card = document.createElement('article');
    card.className = 'card';
    card.innerHTML =
      '<div class="view" aria-label="' + info.name + ', drag to turn"><span class="hint">Drag to turn</span></div>' +
      '<div class="side"><div class="head"><h3>' + info.name + '</h3><span class="tag">' + info.element + '</span></div>' +
      '<p class="note">' + info.note + '</p><ul class="parts">' + info.parts.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul>' +
      '<div class="btns"><button class="ghost" data-a="body" aria-pressed="true">Whole body</button><button class="ghost" data-a="head" aria-pressed="false">Head</button><button class="ghost" data-a="spin" aria-pressed="' + spin + '">Spin</button></div></div>';
    cards.appendChild(card);
    slots.push({ card: card, info: info, entry: null });
  });
  // each creature is built when its card nears the screen, and drawn only while it is on screen
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (list) {
      list.forEach(function (x) {
        var slot = slots.filter(function (sl) { return sl.card === x.target; })[0];
        if (!slot) return;
        if (x.isIntersecting) ensure(slot).vis = true; else if (slot.entry) slot.entry.vis = false;
      });
    }, { rootMargin: '200px' });
    slots.forEach(function (sl) { io.observe(sl.card); });
  } else slots.forEach(ensure);

  var clock = new T.Clock(), elapsed = 0;
  function frame() {
    var dt = Math.min(.05, clock.getDelta()); elapsed += dt;
    live.forEach(function (e, i) {
      if (!e.vis) return;
      var a = e.a, v = e.v;
      if (a.spin && !a.dragging()) a.yaw += dt * .28;
      a.pivot.rotation.y = a.yaw;
      if (!reduced) a.update(elapsed + i * 1.3);
      if (v.mode === 'head') v.fit();
      v.r.render(v.s, v.cam);
    });
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
